<!doctype html>
<style>
:root{
color-scheme:dark;
image-rendering:pixelated;
}
body{margin:0;}
</style>
<canvas id='canvas'></canvas>
<script>
const myImg = new Image()
// Encode my image!
// myImg.src = './sprite/bird.png'

const {floor} = Math
const w = 512
const f = 256/w
const canvas = document.getElementById("canvas")
canvas.width = w
canvas.height = w
const ctx = canvas.getContext("2d")
const img = ctx.createImageData(w, w)
for(let i = 0; i < img.data.length; i += 1) {
  dot(img, i, 255, i%w * f, f*i/w)
}
const color = [0,0,0]
dot(img, 0, ...color)
dot(img, w-1, ...color)
dot(img, w*(w-1), ...color)
dot(img, w*w-1, ...color)

myImg.onload = function(){
  const canvas = document.createElement('canvas')
  canvas.height = this.height
  sprite_w = canvas.width = this.width
  const context = canvas.getContext('2d')
  context.drawImage(myImg, 0, 0)
  const sprite = context.getImageData(0, 0, this.width, this.height)
  const data = sprite.data
  const data_array = new Uint8Array(data.buffer, data.byteOffset, data.length);
  document.body.append(canvas)
  const p = document.createElement('p')
  p.innerText = JSON.stringify({
    height: sprite.height,
    width:sprite.width,
    data: data_array.toBase64(),
  })
  document.body.append(p)
  render(sprite)
}

function render(sprite){
  if(!sprite.data){
    sprite.data = base64ToBytes(sprite.base64)
  }
  const sprite_bytes = sprite.data
  const sprite_w = sprite.width
  for(let i=0, len=sprite_bytes.length; i<len; i+=4){
    sprite_bytes[i+3] && dot(img, ((i/4)%sprite_w) + w * floor(i/(4*sprite_w)), sprite_bytes[i], sprite_bytes[i+1], sprite_bytes[i+2], sprite_bytes[i+3])
  }
  ctx.putImageData(img, 0, 0)
  magnify(2, 16, 0, sprite, ctx)
  magnify(3, 48, 0, sprite, ctx)
  magnify(4, 96, 0, sprite, ctx)
  magnify(5, 160, 0, sprite, ctx)
  magnify(6, 240, 0, sprite, ctx)
  magnify(7, 336, 0, sprite, ctx)
  magnify(8, 0, 96, sprite, ctx)
  magnify(9, 128, 120, sprite, ctx)
  magnify(10, 272, 168, sprite, ctx)
}

function base64ToBytes(b64) {
  const bin = atob(b64)
  const bytes = new Uint8Array(bin.length)
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
  return bytes
}
function dot(image, i, r,g,b,a){
  image.data[i*4] = r ?? 0
  image.data[i*4 + 1] = g ?? 0
  image.data[i*4 + 2] = b ?? 0
  image.data[i*4 + 3] = a ?? 255
}
function magnify(scale, x, y, sprite, c){
  const sprite_bytes = sprite.data
  const sprite_w = sprite.width
  for(let i=0, len=sprite_bytes.length; i<len; i+=4){
    if(!sprite_bytes[i+3]) continue
    c.fillStyle = `rgba(${sprite_bytes[i]??0},${sprite_bytes[i+1]??0},${sprite_bytes[i+2]??0},${sprite_bytes[i+3]??255})`;
    c.fillRect(x + scale * ((i/4)%sprite_w), y + scale * floor(i/(4*sprite_w)), scale, scale)
  }
}
